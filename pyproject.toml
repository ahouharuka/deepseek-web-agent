[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-web-agent"
version = "0.2.0"
description = "Experimental local coding-agent runtime driven by DeepSeek Web"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "DeepSeek Web Agent contributors" }]
dependencies = ["playwright>=1.55,<2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
deepseek-web-agent = "main:main"
deepseek-web-agent-gui = "desktop_app:main"

[tool.setuptools]
py-modules = ["main", "desktop_app"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["adapters*", "agent_skills*", "orchestrator*", "tools*"]

[tool.setuptools.package-data]
agent_skills = ["*.md"]
